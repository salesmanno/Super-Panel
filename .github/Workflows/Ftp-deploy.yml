name :
FTP Deploy til Domeneshop (Super Subdon
on:
push: branches:
- main
jobs: web-deploy:
name: Deploy til server runs-on: ubuntu-latest
timeout-minutes: 30
steps:
- name: Hent nyeste kode uses: actions/checkout@v4
with:
fetch-depth: 0
- name: Synkroniser HTML og PHP til FTP uses: Samkirkland/FTP-Deploy-Action@v4. with:
server: ${{ secrets. FTP_SERVER }} username: ${{ secrets. FTP_USERNAME }) password: ${{ secrets. FTP_PASSWORD })
# Siden super og www er sidestilt, pe
server-dir: /super/
# Viktige innstillinger for at Domene
state-name: . ftp-deploy-state.json timeout: 180000
port: 21
exclude:
**/.git*
**/.git*/**
** / .agents/**
**/.agent/**
**/node modules/**
**/vendor / **
**/*.log
